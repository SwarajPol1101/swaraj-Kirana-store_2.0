<!DOCTYPE html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Swaraj Kirana Store</title>
<style>

html,body{height:100%}*{box-sizing:border-box}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
body{margin:0;background:radial-gradient(900px 400px at 80% -10%,rgba(16,185,129,.18),transparent),var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Noto Sans Devanagari",sans-serif}

.cd{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:12px;margin:10px 0;backdrop-filter:blur(10px)}
.big{width:100%;padding:22px;border:0;border-radius:22px;background:linear-gradient(135deg,#34d399,#047857);color:#fff;font-size:20px;font-weight:700;box-shadow:0 10px 30px rgba(16,185,129,.35);cursor:pointer}
.btn{display:inline-block;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--in);cursor:pointer;text-decoration:none;text-align:center;min-height:42px}
.pri{background:var(--ac);color:#fff;border-color:transparent;font-weight:600}.dng{color:var(--dn)}
input:not([type=checkbox]),select,textarea{width:100%;padding:10px;border-radius:12px;border:1px solid var(--bd);background:var(--in);min-height:42px}
label{display:block;margin:8px 0;font-size:13px;color:var(--mu)}label.ck{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px}
.rw{display:flex;gap:8px;align-items:center}.g{flex:1;min-width:0}small,.mu{color:var(--mu);font-size:12px}
h4{margin:18px 2px 6px;color:var(--mu);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em}h2,h3{margin:4px 0}

.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.st div{text-align:center;padding:10px;border-radius:16px;background:var(--cd);border:1px solid var(--bd)}.st b{font-size:22px;color:var(--ac);display:block}

.qr{display:flex;gap:6px;align-items:center;margin-top:8px}.qr input{width:70px;text-align:center}.qr select{width:auto;flex:1}.qr button{width:40px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--in);cursor:pointer}
.qr .pri{width:auto;padding:0 14px;border:0}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;padding:36px 10px;color:var(--mu)}.empty div{font-size:40px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
#nav button{flex:1;background:none;border:0;color:var(--mu);font-size:12px;cursor:pointer;padding:4px}#nav span{display:block;font-size:20px}#nav .on{color:var(--ac);font-weight:700}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--bg);border:1px solid var(--bd);width:100%;max-width:520px;max-height:90%;overflow:auto;border-radius:22px 22px 0 0;padding:16px}
.dr{align-items:stretch;justify-content:flex-start}.dr .md{max-width:290px;height:100%;max-height:100%;border-radius:0 22px 22px 0}
.dr button.btn{display:block;width:100%;margin:8px 0;text-align:left}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:130px;background:#065f46;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;display:none;max-width:90%}
#sp{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .5s;font-size:22px;font-weight:700}
.li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.warn{color:var(--wr);font-size:12px}textarea{min-height:90px}input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac);flex:none}input[type=file]{padding:8px!important}
</style></head><body>
<div id="sp"></div><header id="hd"></header><main id="main"></main><button id="fab" data-a="cart" hidden></button><nav id="nav"></nav><div id="m"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),K='swaraj_kirana_v1';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const UN=['kg','g','litre','ml','packet','box','piece','bottle','bag','dozen','half kg'];
const T={home:['Home','मुख्यपृष्ठ'],products:['Products','उत्पादने'],orders:['Orders','ऑर्डर'],dealers:['Dealers','डीलर'],newOrder:['Create New Order','नवीन ऑर्डर तयार करा'],frequent:['Frequently ordered','वारंवार मागवलेले'],recent:['Recently ordered','अलीकडे मागवलेले'],recentOrders:['Recent orders','अलीकडील ऑर्डर'],search:['Search English / मराठी','शोधा English / मराठी'],add:['Add','जोडा'],edit:['Edit','बदला'],del:['Delete','हटवा'],cancel:['Cancel','रद्द करा'],saveNext:['Save & Add Next','जतन करा व पुढचे'],saveExit:['Save & Exit','जतन करा व बाहेर'],cart:['Cart','कार्ट'],settings:['Settings','सेटिंग्ज'],backup:['Backup & Restore','बॅकअप व रिस्टोअर'],notif:['Notification Settings','सूचना सेटिंग्ज'],language:['Language','भाषा'],appearance:['Appearance','स्वरूप'],unit:['Unit','एकक'],dealer:['Dealer','डीलर'],noDealer:['No dealer','डीलर नाही'],send:['Send to Dealer','डीलरला पाठवा'],keep:['Keep for Myself','स्वतःसाठी ठेवा'],draft:['Draft','मसुदा'],saved:['Saved','जतन'],shared:['Shared','पाठवले'],confirmed:['Confirmed','पक्के'],yes:['Yes','होय'],no:['No','नाही'],en:['English name','इंग्रजी नाव'],mr:['Marathi name (मराठी)','मराठी नाव'],cat:['Category','वर्ग'],sub:['Subcategory','उपवर्ग'],dealers2:['Associated dealers','संबंधित डीलर'],last:['Last','मागील'],emptyP:['No products yet. Add your first product.','अजून उत्पादने नाहीत. पहिले जोडा.'],emptyD:['No dealers yet.','अजून डीलर नाहीत.'],emptyO:['No orders yet.','अजून ऑर्डर नाहीत.'],cartE:['Cart is empty. Add products first.','कार्ट रिकामे आहे.'],note:['Special instructions','विशेष सूचना'],openWA:['Open WhatsApp','व्हॉट्सअॅप उघडा'],copy:['Copy Message','संदेश कॉपी करा'],dark:['Dark','गडद'],light:['Light','उजळ'],name:['Name','नाव'],unitAdd:['Add custom unit','स्वतःचे एकक जोडा'],stErr:['Storage is full or unavailable. Export a backup now.','स्टोरेज भरले/उपलब्ध नाही. बॅकअप घ्या.'],cats:['Manage categories','वर्ग व्यवस्थापन'],back:['Backup now','आता बॅकअप'],restore:['Restore','रिस्टोअर'],all:['All','सर्व']};
const t=k=>(T[k]||[k,k])[S.lang=='mr'?1:0];
function def(){return{v:1,lang:'en',theme:'dark',ctr:0,n8:false,n6:false,backupAt:null,units:[...UN],cats:[{n:'Grains — धान्य',subs:[]},{n:'Oils — तेल',subs:[]},{n:'Spices — मसाले',subs:[]},{n:'Essentials — जीवनावश्यक',subs:[]}],products:[['Rice','तांदूळ',0,'kg'],['Wheat Flour','गव्हाचे पीठ',0,'kg'],['Sugar','साखर',3,'kg'],['Cooking Oil','खाद्यतेल',1,'litre'],['Tea Powder','चहा पावडर',3,'packet'],['Salt','मीठ',3,'kg'],['Turmeric','हळद',2,'packet']].map((a,i)=>({id:'p'+i,en:a[0],mr:a[1],cat:['Grains — धान्य','Oils — तेल','Spices — मसाले','Essentials — जीवनावश्यक'][a[2]],sub:'',unit:a[3],dealers:[]})),dealers:[],orders:[],prices:[],draft:{oid:null,items:[],note:''}}}
let S=def();try{const d=JSON.parse(localStorage.getItem(K)||'null');if(d&&Array.isArray(d.products))S=Object.assign(def(),d)}catch(e){}
let OK=true;function sv(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){if(OK){OK=false;toast(t('stErr'))}}}
let V='home',Q='',CAT='',SUB='',VM='list',P={},SEL={},CSEL={},OID=null,SD=null,FS='',FD='',CB=null,CB2=null,SH=true,BK='';
const toast=m=>{const e=$('#t');e.textContent=m;e.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>e.style.display='none',2600)};
const nm=x=>[x.en,x.mr].filter(Boolean).map(esc).join(' — ');
const dn=id=>(S.dealers.find(d=>d.id==id)||{}).name||'';
const gO=()=>S.orders.find(o=>o.id==OID);
const gP=id=>S.products.find(p=>p.id==id);
const num=s=>parseFloat(String(s).replace(',','.'));
const LOGO='<svg width="38" height="38" viewBox="0 0 40 40"><rect width="40" height="40" rx="12" fill="#10b981"/><path d="M11 22h18l-2 10H13z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M15 22l3-5M25 22l-3-5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="20" y="18" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="Georgia,serif">S</text></svg>';
$('#sp').innerHTML=LOGO.replace(/38/g,'84')+'<div>Swaraj Kirana Store</div>';setTimeout(()=>{$('#sp').style.opacity=0;setTimeout(()=>$('#sp').remove(),500)},900);
function modal(h,c){$('#m').innerHTML='<div class="ov'+(c||'')+'" data-a="mc"><div class="md">'+h+'</div></div>'}
const cls=()=>$('#m').innerHTML='';
function ask(msg,fy,fn,ly,ln){CB=fy;CB2=fn;modal('<p>'+esc(msg)+'</p><div class="gr"><button class="btn" data-a="no">'+esc(ln||t('no'))+'</button><button class="btn pri" data-a="yes">'+esc(ly||t('yes'))+'</button></div>')}
function inp(title,val,fn){CB=fn;modal('<h3>'+esc(title)+'</h3><input id="iv" maxlength="60" value="'+esc(val||'')+'"><div class="gr" style="margin-top:12px"><button class="btn" data-a="x">'+t('cancel')+'</button><button class="btn pri" data-a="iok">OK</button></div>')}
const lastQ=pid=>{for(const o of [...S.orders].sort((a,b)=>b.ts-a.ts)){const i=o.items.find(x=>x.pid==pid);if(i)return i}return null};
const pp=p=>P[p.id]||(P[p.id]=(l=>({qty:l?l.qty:1,unit:l?l.unit:p.unit}))(lastQ(p.id)));
const uo=(sel)=>S.units.map(u=>'<option'+(u==sel?' selected':'')+'>'+esc(u)+'</option>').join('');
function add2draft(p,qty,unit){const it=S.draft.items.find(i=>i.pid==p.id);if(it){it.qty=qty;it.unit=unit}else S.draft.items.push({pid:p.id,en:p.en,mr:p.mr,cat:p.cat,qty,unit,dealer:''});sv()}
function freq(){const c={};S.orders.forEach(o=>new Set(o.items.map(i=>i.pid)).forEach(p=>c[p]=(c[p]||0)+1));return Object.entries(c).filter(e=>e[1]>=2).sort((a,b)=>b[1]-a[1]).slice(0,6).map(e=>e[0])}
function recent(){const r=[];[...S.orders].sort((a,b)=>b.ts-a.ts).forEach(o=>o.items.forEach(i=>{if(!r.includes(i.pid))r.push(i.pid)}));const f=freq();return r.filter(x=>!f.includes(x)).slice(0,6)}
const chip=pid=>{const p=gP(pid)||(S.orders.flatMap(o=>o.items).find(i=>i.pid==pid));return p?'<span class="ch" data-a="quick" data-i="'+esc(pid)+'">'+nm(p)+'</span>':''};
const badge=o=>'<span class="bd '+o.status+'">'+t(o.status)+'</span>';
const fmtD=ts=>new Date(ts).toLocaleDateString(S.lang=='mr'?'mr-IN':'en-IN',{day:'numeric',month:'short',year:'numeric'});
const empty=(i,m)=>'<div class="empty"><div>'+i+'</div>'+esc(m)+'</div>';
const VW={},LS={};
VW.home=()=>{const h=new Date().getHours(),td=new Date().toDateString(),pend=S.orders.filter(o=>o.status=='shared').length;let b='';
if(S.n8&&h>=8&&!S.orders.some(o=>new Date(o.ts).toDateString()==td))b+='<div class="cd">⏰ '+(S.lang=='mr'?'आजची ऑर्डर तयार करण्याची वेळ.':'Time to prepare today’s order.')+'</div>';
if(S.n6&&h>=18&&pend)b+='<div class="cd">⏰ '+pend+(S.lang=='mr'?' ऑर्डरची डीलर पुष्टी बाकी.':' order(s) awaiting dealer confirmation.')+'</div>';
const dr=S.draft.items.length?'<div class="cd rw"><div class="g">📝 '+(S.lang=='mr'?'अपूर्ण ऑर्डर':'Unfinished order')+' ('+S.draft.items.length+')</div><button class="btn pri" data-a="cart">'+t('cart')+'</button></div>':'';
return b+'<button class="big" data-a="new">＋ '+t('newOrder')+'</button>'+dr+'<div class="st" style="margin-top:12px"><div><b>'+S.orders.length+'</b><small>'+t('orders')+'</small></div><div><b>'+S.products.length+'</b><small>'+t('products')+'</small></div><div><b>'+pend+'</b><small>'+t('shared')+'</small></div></div>'
+'<h4>'+t('frequent')+'</h4><div>'+(freq().map(chip).join('')||'<small>—</small>')+'</div><h4>'+t('recent')+'</h4><div>'+(recent().map(chip).join('')||'<small>—</small>')+'</div><h4>'+t('recentOrders')+'</h4>'+(S.orders.length?[...S.orders].sort((a,b)=>b.ts-a.ts).slice(0,4).map(oc).join(''):empty('🧾',t('emptyO')))};
const oc=o=>'<div class="cd rw" data-a="oopen" data-i="'+o.id+'" style="cursor:pointer"><div class="g"><b>'+esc(o.name)+'</b><br><small>'+fmtD(o.ts)+' · '+o.items.length+' items</small></div>'+badge(o)+'</div>';
function chips(){const c=S.cats.find(x=>x.n==CAT);return '<div class="sc"><span class="ch'+(!CAT?' on':'')+'" data-a="cat" data-i="">'+t('all')+'</span>'+S.cats.map(x=>'<span class="ch'+(CAT==x.n?' on':'')+'" data-a="cat" data-i="'+esc(x.n)+'">'+esc(x.n)+'</span>').join('')+'</div>'+(c&&c.subs.length?'<div class="sc">'+c.subs.map(s=>'<span class="ch'+(SUB==s?' on':'')+'" data-a="sub" data-i="'+esc(s)+'">'+esc(s)+'</span>').join('')+'</div>':'')}
const flt=()=>{const q=Q.trim().toLowerCase();return S.products.filter(p=>(!q||p.en.toLowerCase().includes(q)||p.mr.toLowerCase().includes(q))&&(!CAT||p.cat==CAT)&&(!SUB||p.sub==SUB)).sort((a,b)=>a.en.localeCompare(b.en))};
LS.select=()=>{const l=flt();return (l.length?l.map(p=>{const r=pp(p),la=lastQ(p.id),inC=S.draft.items.some(i=>i.pid==p.id);return '<div class="cd"><div class="rw"><input type="checkbox" data-c="chk" data-i="'+p.id+'"'+(SEL[p.id]?' checked':'')+'>'+th(p)+'<div class="g"><b>'+nm(p)+'</b><br><small>'+esc(p.cat)+(la?' · '+t('last')+': '+la.qty+' '+esc(la.unit):'')+'</small></div>'+(inC?'<span class="bd confirmed">✓</span>':'')+'</div><div class="qr"><button data-a="dec" data-i="'+p.id+'">−</button><input inputmode="decimal" data-c="qty" data-i="'+p.id+'" value="'+esc(r.qty)+'"><button data-a="inc" data-i="'+p.id+'">+</button><select data-c="unit" data-i="'+p.id+'">'+uo(r.unit)+'</select><button class="pri" data-a="addp" data-i="'+p.id+'">'+t('add')+'</button></div></div>'}).join(''):empty('📦',t('emptyP')))};
VW.select=()=>'<input id="q" data-c="q" placeholder="'+esc(t('search'))+'" value="'+esc(Q)+'">'+chips()+'<div class="rw" style="margin:6px 0"><button class="btn" data-a="addsel">'+t('add')+' ☑ (<span id="bc">'+Object.values(SEL).filter(Boolean).length+'</span>)</button></div><div id="list">'+LS.select()+'</div>';
LS.products=()=>{const l=flt();if(!l.length)return empty('📦',t('emptyP'));return VM=='card'?'<div class="gr">'+l.map(p=>'<div class="cd" data-a="pview" data-i="'+p.id+'"><b>'+nm(p)+'</b><br><small>'+esc(p.cat)+'<br>'+esc(p.unit)+'</small></div>').join('')+'</div>':l.map(p=>'<div class="cd rw" data-a="pview" data-i="'+p.id+'">'+th(p)+'<div class="g"><b>'+nm(p)+'</b><br><small>'+esc(p.cat)+(p.sub?' › '+esc(p.sub):'')+'</small></div><small>'+esc(p.unit)+'</small></div>').join('')};
VW.products=()=>'<div class="rw"><input id="q" data-c="q" placeholder="'+esc(t('search'))+'" value="'+esc(Q)+'"><button class="ib" data-a="vm">'+(VM=='list'?'▦':'☰')+'</button></div>'+chips()+'<div class="gr" style="margin:6px 0"><button class="btn pri" data-a="padd">＋ '+t('add')+'</button><button class="btn" data-a="cats">'+t('cats')+'</button></div><div id="list">'+LS.products()+'</div>';
LS.dealers=()=>{const q=Q.trim().toLowerCase(),l=S.dealers.filter(d=>!q||(d.name+d.company).toLowerCase().includes(q));return l.length?l.map(d=>'<div class="cd rw" data-a="dedit" data-i="'+d.id+'"><div class="g"><b>'+esc(d.name)+'</b>'+(d.company?' · '+esc(d.company):'')+'<br><small>WhatsApp: '+esc(d.wa||d.mobile||'—')+(d.cat?' · '+esc(d.cat):'')+'</small></div>›</div>').join(''):empty('🤝',t('emptyD'))};
VW.dealers=()=>'<input id="q" data-c="q" placeholder="'+t('search')+'" value="'+esc(Q)+'"><div class="gr" style="margin:8px 0"><button class="btn pri" data-a="dadd">＋ '+t('add')+'</button><button class="btn" data-a="dimp">📇 '+(S.lang=='mr'?'संपर्कातून':'From contacts')+'</button></div><div id="list">'+LS.dealers()+'</div>';
LS.orders=()=>{const q=Q.trim().toLowerCase();let l=[...S.orders].sort((a,b)=>b.ts-a.ts).filter(o=>(!q||o.name.toLowerCase().includes(q))&&(!FS||o.status==FS)&&(!FD||o.items.some(i=>i.dealer==FD)));if(!l.length)return empty('🧾',t('emptyO'));let g='',o2='';l.forEach(o=>{const d=fmtD(o.ts);if(d!=g){g=d;o2+='<h4>'+d+'</h4>'}o2+=oc(o)});return o2};
VW.orders=()=>'<input id="q" data-c="q" placeholder="'+(S.lang=='mr'?'ऑर्डर शोधा':'Search orders')+'" value="'+esc(Q)+'"><div class="gr" style="margin:8px 0"><select data-c="fs"><option value="">'+(S.lang=='mr'?'स्थिती: ':'Status: ')+t('all')+'</option>'+['draft','saved','shared','confirmed'].map(s=>'<option value="'+s+'"'+(FS==s?' selected':'')+'>'+t(s)+'</option>').join('')+'</select><select data-c="fd"><option value="">'+t('dealers')+': '+t('all')+'</option>'+S.dealers.map(d=>'<option value="'+d.id+'"'+(FD==d.id?' selected':'')+'>'+esc(d.name)+'</option>').join('')+'</select></div><div id="list">'+LS.orders()+'</div>';
